<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iconos de grupos musculares</title>
<style>
  body{background:#0f131c;color:#e5e7eb;font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:0;padding:32px}
  h1{font-size:18px;font-weight:600;margin:0 0 20px}
  .grid{display:flex;flex-wrap:wrap;gap:16px}
  .card{background:#1b2130;border:1px solid #2a3242;border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;min-width:150px}
  .card img{width:28px;height:28px;display:block}
  .lbl{font-size:14px}
  .sizes{margin-top:28px;display:flex;gap:14px;align-items:flex-end}
  .sizes figure{margin:0;text-align:center;color:#9ca3af;font-size:11px}
  .sizes img{display:block;margin:0 auto 6px}
</style>
</head>
<body>
  <h1>Ilustraciones de grupos musculares (SVG)</h1>
  <div class="grid">
    <div class="card"><img src="pecho.svg" alt="Pecho"><span class="lbl">Pecho</span></div>
    <div class="card"><img src="espalda.svg" alt="Espalda"><span class="lbl">Espalda</span></div>
    <div class="card"><img src="pierna.svg" alt="Pierna"><span class="lbl">Pierna</span></div>
    <div class="card"><img src="hombros.svg" alt="Hombros"><span class="lbl">Hombros</span></div>
    <div class="card"><img src="biceps.svg" alt="Biceps"><span class="lbl">Bíceps</span></div>
    <div class="card"><img src="triceps.svg" alt="Triceps"><span class="lbl">Tríceps</span></div>
    <div class="card"><img src="abdomen.svg" alt="Abdomen"><span class="lbl">Abdomen</span></div>
  </div>

  <div class="sizes">
    <figure><img src="pecho.svg" width="24" height="24">24 px</figure>
    <figure><img src="pecho.svg" width="28" height="28">28 px</figure>
    <figure><img src="pecho.svg" width="32" height="32">32 px</figure>
  </div>
</body>
</html>
